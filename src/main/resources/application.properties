spring.application.name=app
spring.datasource.url=jdbc:postgresql://localhost:5432/wallet_db
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.datasource.username=wallet_user
spring.datasource.password=wallet_password

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
logging.level.org.flywaydb=DEBUG
logging.level.org.springframework.boot.autoconfigure.flyway=DEBUG

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

jwt.secret=your-very-long-secret-key-change-this
jwt.expiration=3600000


# Application logs
logging.level.com.wallet.app=DEBUG

# Spring Security
#logging.level.org.springframework.security=DEBUG

